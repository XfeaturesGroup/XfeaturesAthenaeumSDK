name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, typecheck, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: packages/athenaeum
        run: npm install

      - name: Typecheck
        working-directory: packages/athenaeum
        run: npm run typecheck

      - name: Build
        working-directory: packages/athenaeum
        run: npm run build

      - name: Test
        working-directory: packages/athenaeum
        run: npm test

      # Proves what would actually publish, without publishing. This job never
      # runs `npm publish` -- release.yml owns that, gated on a version tag.
      - name: Pack dry-run
        working-directory: packages/athenaeum
        run: npm pack --dry-run

      - name: Tarball contains no source, tests or scratch files
        working-directory: packages/athenaeum
        run: |
          npm pack --silent
          tarball=$(ls xfeaturesgroup-athenaeum-*.tgz)
          list=$(tar -tzf "$tarball")
          echo "$list"
          if echo "$list" | grep -qE '\.test\.|package/src/'; then
            echo "Tarball contains source or test files -- fix package.json's files list."
            exit 1
          fi
          for required in LICENSE README.md package.json dist/index.js dist/index.d.ts; do
            echo "$list" | grep -q "package/$required" || { echo "Missing $required from the tarball."; exit 1; }
          done
          rm -f "$tarball"
          echo "Tarball contents verified."

  publishable-guard:
    name: This package is deliberately publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node -e "
            const pkg = require('./packages/athenaeum/package.json');
            if (pkg.private === true) { console.error('athenaeum is marked private -- this package is meant to publish.'); process.exit(1); }
            if (pkg.publishConfig?.access !== 'public') { console.error('publishConfig.access must be \"public\" for a scoped package.'); process.exit(1); }
            if (!pkg.repository?.url?.includes('XfeaturesAthenaeumSDK')) { console.error('repository.url must point at this repository, exactly, for Trusted Publishing to match.'); process.exit(1); }
            console.log('athenaeum: publishable and correctly configured.');
          "

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: packages/athenaeum
        run: npm install --package-lock-only && npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
      - name: Scan the working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
